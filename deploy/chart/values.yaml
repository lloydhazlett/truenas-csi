namespace: truenas-csi

truenas:
  url: ""
  defaultPool: ""
  nfsServer: ""
  iscsiPortal: ""
  iscsiIQNBase: ""
  insecureSkipVerify: ""

apiSecret:
  name: ""
  key: password

images:
  csiDriver:
    repository: ghcr.io/truenas/truenas-csi
    tag: v1.0.3
    pullPolicy: IfNotPresent
  provisioner:
    repository: registry.k8s.io/sig-storage/csi-provisioner
    tag: v6.1.1
  attacher:
    repository: registry.k8s.io/sig-storage/csi-attacher
    tag: v4.11.0
  snapshotter:
    repository: registry.k8s.io/sig-storage/csi-snapshotter
    tag: v8.5.0
  resizer:
    repository: registry.k8s.io/sig-storage/csi-resizer
    tag: v2.1.0
  nodeDriverRegistrar:
    repository: registry.k8s.io/sig-storage/csi-node-driver-registrar
    tag: v2.16.0
  livenessProbe:
    repository: registry.k8s.io/sig-storage/livenessprobe
    tag: v2.18.0

controller:
  replicas: 1
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "200m"

node:
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "200m"

csiDriver:
  name: csi.truenas.io
  attachRequired: true
  podInfoOnMount: true
  fsGroupPolicy: File
